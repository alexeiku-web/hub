<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f6e7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. Home is a scan list: today's workout, habit lines, projects by urgency, to-dos. Every row opens a detail page. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#18222b; --muted:#5b6975; --line:#d5dce2;
  --accent:#0f6e7a; --accent-ink:#ffffff; --mark:#b97f00; --good:#2a8048; --bad:#b3372f;
  --wood:#e9dcc3; --wood-line:#b8a47c; --hold:#fbf6ea;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10171c; --surface:#19232a; --ink:#e6edf1; --muted:#93a3af; --line:#2b3943;
    --accent:#4fc3cf; --accent-ink:#06262b; --mark:#f2bd3a; --good:#5fc480; --bad:#f08a80;
    --wood:#3a3226; --wood-line:#6b5c40; --hold:#2a251c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10171c; --surface:#19232a; --ink:#e6edf1; --muted:#93a3af; --line:#2b3943;
  --accent:#4fc3cf; --accent-ink:#06262b; --mark:#f2bd3a; --good:#5fc480; --bad:#f08a80;
  --wood:#3a3226; --wood-line:#6b5c40; --hold:#2a251c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
#view{display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.small{font-size:13px;color:var(--muted)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.pin{border-left:5px solid var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.tag{font-size:12px;font-weight:600;letter-spacing:.3px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.hot{border-color:var(--mark);color:var(--mark)}
.back{font-weight:600;text-decoration:none;font-size:15px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
ul.plain li::marker{color:var(--accent)}
.checks{display:flex;flex-direction:column}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checks label.ck:last-child{border-bottom:0}
label.ck input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
label.ck.on span.t{color:var(--muted);text-decoration:line-through}
label.ck span.t{overflow-wrap:anywhere}
.code{display:inline-block;min-width:34px;text-align:center;font-family:var(--display);font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 5px;margin-right:6px;text-decoration:none}
a.proj{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);padding:12px 0;border-bottom:1px solid var(--line)}
a.proj:last-child{border-bottom:0;padding-bottom:0}
a.proj .name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
a.proj .next{font-size:14px}
a.proj .next b{color:var(--accent);font-weight:600}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{font-family:var(--display);font-weight:600;font-size:17px;text-align:center;text-decoration:none;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.btn,label.btn{font-family:var(--body);font-weight:600;font-size:15px;padding:9px 14px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.btn.ghost,label.btn.ghost{background:transparent;color:var(--accent)}
button.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
button.link{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.warn{font-size:14px;border-left:3px solid var(--mark);padding-left:10px}
.done-banner{font-weight:600;color:var(--good)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-size:15px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
svg.board{width:100%;height:auto;display:block}
input[type=text],input[type=url],input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:100px;resize:vertical}
form{display:flex;flex-direction:column;gap:8px}
form.inline{flex-direction:row;flex-wrap:wrap;align-items:center}
form.inline input[type=text]{flex:1 1 180px;width:auto}
form.inline select{flex:0 1 150px;width:auto}
label.f{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
details[open] summary{margin-bottom:8px}
.think li.cl{color:var(--ink)}
.by{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px;white-space:nowrap}
.doc{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:14px;margin:0;background:var(--bg);border-radius:8px;padding:10px}
.doc img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap"><main id="view"><p class="sub">Loading…</p></main></div>
<script>
"use strict";
/* ================= Workout plan content ================= */
var DAYS = [
  {k:"Mon", name:"Monday", title:"Treadmill, steady + Strength A", order:["steps","circuit"], circuit:"A",
   base:["Treadmill: 25–30 min brisk walk or easy jog at 1–3% incline. Hold a pace where you can talk in full sentences."],
   push:["Treadmill: 35–40 min at the same easy, talking-pace effort, 1–3% incline."]},
  {k:"Tue", name:"Tuesday", title:"Beastmaker + FitOn stretch", order:["board","steps"], board:"first",
   base:["FitOn stretch, 15 min: hips, hamstrings, shoulders."], push:["FitOn stretch, 15 min: hips, hamstrings, shoulders."]},
  {k:"Wed", name:"Wednesday", title:"Treadmill, intervals", order:["steps"],
   base:["5 min easy.","6 rounds: 1 min hard, 2 min easy. Hard means you can only get out a few words.","5 min easy."],
   push:["5 min easy.","4 rounds: 3 min hard, 3 min easy. In weeks 7–8 make the hard part 4 min.","5 min easy."]},
  {k:"Thu", name:"Thursday", title:"Beastmaker + Strength B", order:["board","circuit"], board:"second", circuit:"B", base:[], push:[]},
  {k:"Fri", name:"Friday", title:"Long easy cardio + FitOn stretch", order:["steps"],
   base:["40 min easy: incline treadmill walk, outdoor walk or hike.","FitOn stretch or yoga, 10–15 min."],
   push:["50–60 min easy: incline treadmill walk, outdoor walk or hike.","FitOn stretch or yoga, 10–15 min."]},
  {k:"Sat", name:"Saturday", title:"Gym climbing + FitOn stretch", order:["steps"],
   base:["Climb 45–60 min of easy volume: lots of climbs well within your limit. Stop before you fall off tired.","FitOn stretch, 10 min: forearms, shoulders, hips."],
   push:["Climb 60–90 min. Warm up on easy climbs, then 4–6 harder attempts with 3 min rests, then easy laps to finish.","FitOn stretch, 10 min: forearms, shoulders, hips."]},
  {k:"Sun", name:"Sunday", title:"Rest + FitOn mobility", order:["steps"],
   base:["FitOn yoga or full-body stretch class, 20–30 min. Nothing else."],
   push:["FitOn yoga or full-body stretch class, 20–30 min. Keep this day easy even when you feel good."]}
];
var CIRCUITS = {
  A:{name:"Strength A", items:["Dumbbell bench or floor press, 8–10","Push-ups, stop 2 short of failure","Bodyweight squats, 12–15","Dumbbell overhead press, 8–10","Plank, 30–45 s"]},
  B:{name:"Strength B", items:["Dumbbell press (incline if you have a bench), 8–10","Reverse lunges, 8 per leg","Glute bridges, 12–15","Dead bugs, 8 per side","Prone Y-T-W raises, 6 of each"]}
};
var HOLD_NAMES = {J:"Jug",S35:"35° sloper",S20:"20° sloper",D4:"Deep 4-finger pocket",D3:"Deep 3-finger pocket",D2:"Deep 2-finger pocket",VD4:"Very deep 4-finger pocket",M4:"Medium 4-finger pocket",M3:"Medium 3-finger pocket",M2:"Medium 2-finger pocket",S4:"Small 4-finger pocket (10 mm)"};
var BLOCKS = [
  {weeks:"Weeks 1–2", name:"Fast reload", on:["J","D4","S20"],
   both:function(w){ var a = w<=1 ? "6 × 10 s with feet on a chair" : "6 × 10 s at bodyweight"; var r=[["J",a+"."],["D4",a+"."]]; if(w>=2){ r.push(["S20","3 × 7 s."]); } r.push(["J","3 × 5 scapular pulls, then 3 × 3 pull-ups."]); return r; }},
  {weeks:"Weeks 3–4", name:"Repeaters", on:["J","D4","S20","D3"],
   both:function(w){ return [["D4","4 repeater sets."],["S20","3 repeater sets."],["D3","2 repeater sets, "+(w<=3?"feet assisting":"at bodyweight")+"."],["J","4 × 5 pull-ups."]]; }},
  {weeks:"Weeks 5–6", name:"Max hangs begin", on:["M4","S35","D3","D4","S20","J"],
   first:[["M4","5 × 10 s, 3 min rest. Choose a load you could hold for about 13 s."],["S35","3 × 10 s."],["D3","3 × 10 s."]],
   second:[["D4","5 repeater sets."],["S20","3 repeater sets."],["D3","2 repeater sets."],["J","4 × 5 pull-ups."]]},
  {weeks:"Weeks 7–8", name:"Add load", on:["M4","M3","S35","D4","S20","D3","J"],
   first:[["M4","6 × 10 s. Add 5–10 lb once all six are clean."],["M3","3 × 7 s at bodyweight."],["S35","4 × 10 s."]],
   second:[["D4","5 repeater sets."],["S20","3 repeater sets."],["D3","3 repeater sets."],["J","4 × 6–8 pull-ups, or weighted sets of 5."]]}
];
var BOARD_RULES = ["Open-hand or half-crimp only. Never full crimp on the board.","Shoulders engaged, elbows slightly bent. No dead sag.","End each hang with 2–3 seconds in reserve.","Sharp pain in a finger or palm: stop for the day.","Repeater set: 7 s on, 3 s off, six times. Rest 3 min between sets; 1 min between single hangs.","Warm up first: arm circles, wrist rolls, then 2–3 easy hangs on the jugs with feet on a chair."];
var PLAN_RULES = ["Fingers come first. If a finger or palm feels sharp or tweaky, drop Thursday's board session before anything else.","Missed a day? Skip it and carry on. Don't stack two sessions to catch up.","Easy days stay easy. Monday and Friday cardio should feel almost too gentle.","FitOn: use the Stretching and Yoga categories and choose classes by length and body area.","Circuits: do the moves in order, rest 60–90 s between moves, then repeat the round. Pick a dumbbell you could press about 12 times."];

/* ================= Helpers ================= */
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs){ for(var k in attrs){ var v = attrs[k]; if(v===false || v==null){ continue; } if(k==="text"){ n.textContent = v; } else if(k==="class"){ n.className = v; } else if(k.indexOf("on")===0){ n.addEventListener(k.slice(2), v); } else if(k==="checked"){ n.checked = !!v; } else { n.setAttribute(k, v); } } }
  (kids||[]).forEach(function(c){ if(c!=null){ n.appendChild(typeof c==="string" ? document.createTextNode(c) : c); } });
  return n;
}
function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseIso(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ return addDays(d, -((d.getDay()+6)%7)); }
function fmtDate(d){ return d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}); }
function safeUrl(u){ try{ var x = new URL(u); return (x.protocol==="https:"||x.protocol==="http:") ? x.href : null; }catch(e){ return null; } }
function newId(p){ return (p||"m") + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ================= State ================= */
var testDate = (location.search.match(/[?&]date=(\d{4}-\d\d-\d\d)/)||[])[1];
var today = testDate ? parseIso(testDate) : new Date();
var todayKey = iso(today), todayIdx = (today.getDay()+6)%7, thisMonday = mondayOf(today);
var D = null;                       // data.json
var LS = "hub-v1";
var S = { start:null, ticks:{}, my:[], myList:[], gone:{}, daily:[] };
var UI = { msg:"", form:null, confirmDel:null, openNote:{}, cmeUndo:false, dataErr:false };
(function(){ try{ var s = JSON.parse(localStorage.getItem(LS)||"null"); if(s){ for(var k in S){ if(s[k]!=null){ S[k]=s[k]; } } } }catch(e){} })();
S.daily = (S.daily||[]).filter(function(d){ return d.date>=todayKey || !S.ticks["t:"+d.id]; });
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); UI.saveErr=false; }catch(e){ UI.saveErr=true; } }
function ticked(k){ return !!S.ticks[k]; }
function setTick(k,on){ if(on){ S.ticks[k]=Date.now(); } else { delete S.ticks[k]; } save(); }

function weekInfo(){
  if(!S.start){ return {n:1,set:false}; }
  return {n: Math.round((thisMonday - mondayOf(parseIso(S.start)))/(7*864e5)) + 1, set:true};
}
function clampWeek(){ return Math.min(8, Math.max(1, weekInfo().n)); }
function blockFor(w){ return BLOCKS[Math.floor((w-1)/2)]; }
function boardRows(dayBoard, w){ var b = blockFor(w); return b.both ? b.both(w) : b[dayBoard]; }

/* ================= Shared pieces ================= */
function check(key, textNode, opts){
  var on = ticked(key);
  var input = el("input",{type:"checkbox",id:"ck-"+key.replace(/[^a-zA-Z0-9_-]/g,"_"),checked:on,onchange:function(e){ setTick(key, e.target.checked); if(opts && opts.after){ opts.after(e.target.checked); } render(); }});
  return el("label",{class:"ck"+(on?" on":"")},[ input, el("span",{class:"t"}, Array.isArray(textNode)?textNode:[textNode]) ]);
}
var LEFT = [["J",1.5,9,10.5,14],["S35",10,18.5,10.5,14],["S20",19.5,28.5,10.5,14],["D4",1.5,9,5.75,9.25],["D2",10,14,5.75,9.25],["D3",15,20.5,5.75,9.25],["M4",1.5,9,1,4.5],["M2",10,14,1,4.5],["M3",15,20.5,1,4.5],["S4",21.5,28.5,1,4.5]];
function boardSvg(on, labelAll){
  var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 580 150"); svg.setAttribute("class","board"); svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Hangboard schematic. Holds to use: " + on.map(function(c){return HOLD_NAMES[c];}).join(", "));
  function rect(x,y,w,h,r,fill,stroke){ var e = document.createElementNS(NS,"rect"); e.setAttribute("x",x); e.setAttribute("y",y); e.setAttribute("width",w); e.setAttribute("height",h); e.setAttribute("rx",r); e.setAttribute("fill",fill); e.setAttribute("stroke",stroke); svg.appendChild(e); }
  rect(1,1,578,148,18,"var(--wood)","var(--wood-line)");
  var all = []; LEFT.forEach(function(h){ all.push(h); all.push([h[0],58-h[2],58-h[1],h[3],h[4]]); }); all.push(["VD4",22,36,5.75,9.25]);
  all.forEach(function(h){
    var active = on.indexOf(h[0])>=0, x=h[1]*10, w=(h[2]-h[1])*10, y=(15-h[4])*10, ht=(h[4]-h[3])*10;
    rect(x,y,w,ht,6, active?"var(--accent)":"var(--hold)", active?"var(--accent)":"var(--wood-line)");
    if(active || labelAll){ var t = document.createElementNS(NS,"text"); t.setAttribute("x",x+w/2); t.setAttribute("y",y+ht/2+6); t.setAttribute("text-anchor","middle"); t.setAttribute("font-family","Barlow Condensed, Arial Narrow, Arial, sans-serif"); t.setAttribute("font-weight","700"); t.setAttribute("font-size","17"); t.setAttribute("fill", active?"var(--accent-ink)":"var(--muted)"); t.textContent = h[0]; svg.appendChild(t); }
  });
  return svg;
}
function holdText(r){ return [el("span",{class:"code",text:r[0],title:HOLD_NAMES[r[0]]}), HOLD_NAMES[r[0]] + ": " + r[1]]; }
function plain(items){ return el("ul",{class:"plain"}, items.map(function(t){ return el("li",{text:t}); })); }
function backLink(){ return el("a",{class:"back",href:"#home",text:"‹ Hub"}); }

/* ================= Home ================= */
function workoutTile(){
  var wi = weekInfo(), w = clampWeek(), push = w>=5, day = DAYS[todayIdx];
  var keys = [], kids = [];
  var head = !wi.set ? "No start date yet. Showing week 1." : wi.n<1 ? "Starts " + fmtDate(mondayOf(parseIso(S.start))) + ". Showing week 1." : wi.n>8 ? "Eight weeks complete. Showing week 8." : "Week " + wi.n + " of 8";
  kids.push(el("div",{class:"row spread"},[ el("div",null,[ el("h3",{text:"Today's workout · " + head}), el("h2",{text:day.title}) ]),
    !wi.set ? el("button",{class:"btn",id:"start-week",type:"button",text:"Start this week",onclick:function(){ S.start = iso(thisMonday); save(); render(); }}) : null ]));
  var n = 0;
  function add(node){ var k = "w:"+todayKey+":"+(n++); keys.push(k); return check(k, node); }
  day.order.forEach(function(part){
    if(part==="steps"){ kids.push(el("div",{class:"checks"}, (push?day.push:day.base).map(function(t){ return add(t); }))); }
    if(part==="board"){
      var b = blockFor(w), rows = boardRows(day.board, w);
      var label = b.both ? "Board session" : (day.board==="first" ? "Max-hang session" : "Repeater session");
      kids.push(el("h3",{text:label + " · " + b.weeks}));
      kids.push(boardSvg(rows.map(function(r){return r[0];}), false));
      kids.push(el("p",{class:"small",text:"Warm up first. Open-hand or half-crimp only. Repeater set: 7 s on, 3 s off, six times; 3 min between sets."}));
      kids.push(el("div",{class:"checks"}, rows.map(function(r){ return add(holdText(r)); })));
    }
    if(part==="circuit"){
      var c = CIRCUITS[day.circuit];
      kids.push(el("h3",{text:c.name + " · " + (push?"3":"2") + " rounds, 60–90 s rest between moves"}));
      kids.push(el("div",{class:"checks"}, c.items.map(function(t){ return add(t); })));
    }
  });
  var all = keys.length && keys.every(ticked);
  if(all){ kids.push(el("p",{class:"done-banner",role:"status",text:"Session complete."})); }
  kids.push(el("a",{href:"#workout",class:"small",text:"Full plan, board key and printable sheets"}));
  return el("section",{class:"card pin","aria-label":"Today's workout"}, kids);
}
function habitKey(h){ return "h:"+h.id+":"+(h.period==="week" ? iso(addDays(today, -((today.getDay()+1)%7))) : todayKey); }
function habits(){
  var out = [];
  (D.habits||[]).forEach(function(h){
    if(h.days.indexOf(today.getDay())<0){ return; }
    var k = habitKey(h), on = ticked(k);
    if(on && h.hideWhenDone){
      if(UI.cmeUndo===h.id){ out.push(el("p",{class:"small"},[ h.label + ": done. ", el("button",{type:"button",class:"link",text:"Undo",onclick:function(){ setTick(k,false); UI.cmeUndo=false; render(); }}) ])); }
      return;
    }
    out.push(check(k, h.label, {after:function(v){ UI.cmeUndo = (v && h.hideWhenDone) ? h.id : false; }}));
  });
  // One-day tasks, kept on this device. Unfinished ones carry over to the next day.
  S.daily.filter(function(d){ return d.date===todayKey || (d.date<todayKey && !ticked("t:"+d.id)); }).forEach(function(d){
    var node = [d.text];
    if(d.date<todayKey){ node.push(el("span",{class:"by",text:"carried over"})); }
    if(ticked("t:"+d.id)){ node.push(" "); node.push(el("button",{type:"button",class:"link",text:"clear",onclick:function(e){ e.preventDefault(); S.daily = S.daily.filter(function(x){ return x.id!==d.id; }); delete S.ticks["t:"+d.id]; save(); render(); }})); }
    out.push(check("t:"+d.id, node));
  });
  var form = el("form",{class:"inline",onsubmit:function(e){
      e.preventDefault(); var v = document.getElementById("day-text").value.trim(); if(!v){ return; }
      S.daily.push({id:newId("d"), text:v, date:todayKey}); save(); render();
      var again = document.getElementById("day-text"); if(again){ again.focus(); }
